name: Assemble screw app.js
on:
  push:
    paths:
      - 'screw/app.js.gz.b64'
      - '.github/workflows/assemble-screw-app.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode gzip+base64 into screw/app.js
        run: |
          base64 -d screw/app.js.gz.b64 | gunzip > screw/app.js
          wc -c screw/app.js
          python3 -c "import hashlib,pathlib; b=pathlib.Path('screw/app.js').read_bytes(); print(len(b), hashlib.sha256(b).hexdigest())"
      - name: Commit assembled app.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screw/app.js
          if git diff --staged --quiet; then
            echo "No change"
          else
            git commit -m "build: assemble full screw/app.js from gzip payload (~22KB)"
            git push
          fi
