name: Apply part byte fixes
on:
  push:
    paths:
      - '_fixes/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply offset fixes
        run: |
          set -euo pipefail
          python3 << 'PY'
          import json, hashlib, pathlib
          root = pathlib.Path('_fixes')
          if not root.exists():
            print('no _fixes'); raise SystemExit(0)
          for f in sorted(root.glob('*.json')):
            corr = json.loads(f.read_text())
            path = pathlib.Path(corr['path'])
            if not path.exists():
              print('skip missing', path); continue
            data = bytearray(path.read_bytes())
            cur_blob = hashlib.sha1(b'blob %d\0'%len(data)+bytes(data)).hexdigest()
            if cur_blob == corr['expected_blob']:
              print('already ok', path, cur_blob)
              continue
            for fix in corr['fixes']:
              off = fix['offset']
              cur = chr(data[off])
              if cur == fix['to']:
                continue
              if cur != fix['from']:
                raise SystemExit(f'unexpected at {path}:{off}: got {cur!r} want from={fix["from"]!r} or to={fix["to"]!r}')
              data[off] = ord(fix['to'])
            data = bytes(data)
            blob = hashlib.sha1(b'blob %d\0'%len(data)+data).hexdigest()
            assert blob == corr['expected_blob'], (blob, corr['expected_blob'])
            path.write_bytes(data)
            print('fixed', path, 'blob', blob, 'nfixes', len(corr['fixes']))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _parts/ || true
          if git diff --staged --quiet; then echo No change; else
            git commit -m "fix: apply _fixes byte patches to _parts"
            git push
          fi
