name: Apply holdover branding payload

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rename-holdover-branding.yml

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode, edit, and repack page payload
        run: |
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          p = Path('insulation-holdover/page.html.gz.b64')
          html = gzip.decompress(base64.b64decode(p.read_bytes())).decode('utf-8')
          replacements = {
              '<title>箱体断电保温性能 · 回温 ≥120 min 校核与达标反推</title>': '<title>保温校核（断电回温） · 回温校核与达标反推</title>',
              '<p class="eyebrow">Power-off Holdover · τ ≥ 120 min</p>': '<p class="eyebrow">保温校核（断电回温） · τ ≥ 120 min</p>',
              '<h1>箱体断电保温性能 · 回温校核与达标反推</h1>': '<h1>保温校核（断电回温） · 回温校核与达标反推</h1>',
              '<div>断电保温校核台 · 回温 0→20 ℃ ≥ 120 min · 方案存于本机 localStorage</div>': '<div>保温校核（断电回温） · 回温 0→20 ℃ ≥ 120 min · 方案存于本机 localStorage</div>',
              'xCell("箱体断电保温性能校核")': 'xCell("保温校核（断电回温）")',
              '<b>箱体断电保温性能计算书 · ${esc(name)}</b>': '<b>保温校核（断电回温）计算书 · ${esc(name)}</b>',
          }
          for old, new in replacements.items():
              if old not in html:
                  raise SystemExit(f'missing expected string: {old}')
              html = html.replace(old, new)
          if 'Tamb:32, RH:60, tlim:120' not in html:
              raise SystemExit('default tlim=120 missing')
          p.write_bytes(base64.b64encode(gzip.compress(html.encode('utf-8'), compresslevel=9, mtime=0)) + b'\n')
          PY
          base64 -d insulation-holdover/page.html.gz.b64 | gzip -t
      - name: Commit page and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add insulation-holdover/page.html.gz.b64
          git rm .github/workflows/rename-holdover-branding.yml
          git commit -m 'feat: rename holdover page branding'
          git push
