name: Assemble page.html.gz.b64 from parts
on:
  push:
    paths:
      - '_parts/**'
      - '.github/workflows/assemble-pages.yml'
  workflow_dispatch:
    inputs:
      page:
        description: 'Page to assemble (heating-film, cooldown, condenser, insulation-holdover, evaporator, or all)'
        required: true
        default: 'all'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble parts into page.html.gz.b64
        env:
          PAGE_INPUT: ${{ github.event.inputs.page || 'all' }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import json, pathlib, os
          page_input = os.environ.get("PAGE_INPUT") or "all"
          if page_input == "all":
            pages = ["heating-film", "cooldown", "condenser", "insulation-holdover", "evaporator"]
          else:
            pages = [page_input]
          for page in pages:
            dirp = pathlib.Path(f"_parts/{page}")
            if not dirp.is_dir():
              print("skip missing", dirp)
              continue
            parts = sorted(dirp.glob("*.txt"))
            data = b"".join(p.read_bytes() for p in parts)
            man_path = dirp / "MANIFEST.json"
            if man_path.exists():
              man = json.loads(man_path.read_text())
              n = man.get("n_parts")
              total = man.get("total_len")
              if n is not None and len(parts) != n:
                print(f"SKIP {page}: have {len(parts)} parts, need {n}")
                continue
              if total is not None and len(data) != total:
                print(f"SKIP {page}: len {len(data)} != total_len {total}")
                continue
            if len(data) < 1000:
              print(f"SKIP {page}: too short {len(data)}")
              continue
            if not data.startswith(b"H4s"):
              print(f"SKIP {page}: bad head {data[:20]!r}")
              continue
            out = pathlib.Path(f"{page}/page.html.gz.b64")
            out.parent.mkdir(parents=True, exist_ok=True)
            out.write_bytes(data)
            print(f"assembled {out} len={len(data)} head={data[:20]!r}")
          PY
      - name: Commit assembled pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add */page.html.gz.b64 || true
          if git diff --staged --quiet; then
            echo "No change"
          else
            git commit -m "build: assemble page.html.gz.b64 from _parts"
            git push
          fi
